[project]
name = "matrix-os"
version = "0.1.0"
description = "Matrix-style OS for software development with Python TUI"
authors = [
    {name = "Matrix OS Team", email = "team@matrix-os.dev"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["tui", "terminal", "matrix", "development", "ide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]

dependencies = [
    "textual>=0.50.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "pygments>=2.17.0",
    "aiofiles>=23.2.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "textual-dev>=1.3.0",
]

[project.scripts]
matrix-os = "src.core.app:main"
mxos = "src.core.app:main"
matrix-cli = "curaops.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "curaops*"]
exclude = ["curaops.tests*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "curaops/skills/change_request/tests",
    "curaops/skills/accountable_agent/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
