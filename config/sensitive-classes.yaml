# sensitive-classes.yaml
# Loaded by conduvera/control/gateway/config.py via _load_yaml()
# Expected format: top-level 'sensitive_classes' key
# class-name -> cloud_allowed, description

sensitive_classes:
  general:
    cloud_allowed: true
    description: "Non-sensitive general content"

  admin:
    cloud_allowed: false
    description: "Administrative operations and credentials"

  pii:
    cloud_allowed: false
    description: "Personally identifiable information"

  financial:
    cloud_allowed: false
    description: "Financial records and transactions"

  health:
    cloud_allowed: false
    description: "Health and medical data"

  legal:
    cloud_allowed: false
    description: "Legally privileged or compliance-restricted data"

  security:
    cloud_allowed: false
    description: "Security-related data, keys, and secrets"
