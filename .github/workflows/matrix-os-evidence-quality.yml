name: Matrix OS Evidence Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evidence-quality:
    name: Evidence/report focused gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run focused evidence/report tests
        run: >-
          python -m pytest
          tests/test_packaging_contract.py
          tests/test_scaffolding_contract.py
          tests/test_widgets.py
          tests/test_evidence_backbone_contract.py
          tests/test_agent_evidence_plane_adapter.py
          tests/test_safety_guard_adapter.py
          tests/test_evidence_adapter_registry.py
          tests/test_failure_loop_adapter.py
          tests/test_product_coherence_scenarios.py
          tests/test_harness_gateway_contract.py
          tests/test_evidence_operator_report.py
          tests/test_evidence_report_golden_outputs.py
          tests/test_evidence_report_contract_version.py
          curaops/skills/change_request/tests
          curaops/skills/accountable_agent/tests
          curaops/skills/aspice_conflict_detector/test_conflict_detector.py
          curaops/skills/aspice_link_manager/tests
          -q

      - name: Compare CLI text golden output
        run: |
          python -m curaops.cli.main evidence report tests/fixtures/evidence/operator_report/product_coherence.events.jsonl --format text > /tmp/report.txt
          cmp -s /tmp/report.txt tests/fixtures/evidence/operator_report/product_coherence.expected.txt

      - name: Compare CLI Markdown golden output
        run: |
          python -m curaops.cli.main evidence report tests/fixtures/evidence/operator_report/product_coherence.events.jsonl --format markdown > /tmp/report.md
          cmp -s /tmp/report.md tests/fixtures/evidence/operator_report/product_coherence.expected.md

      - name: Compare CLI JSON golden output
        run: |
          python -m curaops.cli.main evidence report tests/fixtures/evidence/operator_report/product_coherence.events.jsonl --format json > /tmp/report.json
          cmp -s /tmp/report.json tests/fixtures/evidence/operator_report/product_coherence.expected.json

      - name: Run ruff on evidence/report surface
        run: >-
          python -m ruff check
          curaops/evidence
          curaops/cli/commands/evidence.py
          tests/test_evidence_operator_report.py
          tests/test_evidence_report_golden_outputs.py
          tests/test_evidence_report_contract_version.py

      - name: Check whitespace in tracked diff
        run: git diff --check
