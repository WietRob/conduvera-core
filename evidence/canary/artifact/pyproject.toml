[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-harness-adapter"
version = "1.0.0"
description = "Versioned Conduvera harness gateway adapter for OpenCode (built from hermes-agent 6a5e51db)"
requires-python = ">=3.10"

[project.entry-points."curaops.harness.adapters"]
opencode_cli = "opencode_harness_adapter.opencode_gateway_adapter:entry_point"

[tool.setuptools.packages.find]
where = ["src"]
