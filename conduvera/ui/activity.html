<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conduvera — Activity</title>
<style>
  :root { --bg:#0f1115; --panel:#161a21; --line:#262c38; --text:#e6e9ef;
          --muted:#8b93a3; --accent:#4f8cff; --ok:#2ecc71; --err:#e74c3c;
          --warn:#f39c12; --run:#3498db; --que:#9b59b6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; }
  #conn { font-size:12px; padding:4px 10px; border-radius:12px; }
  #conn.live { background:#16241a; color:var(--ok); }
  #conn.stale, #conn.error { background:#241a16; color:var(--warn); }
  #counts { margin-left:auto; font-size:13px; color:var(--muted); }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .section-title { font-size:13px; text-transform:uppercase; letter-spacing:.06em;
                   color:var(--muted); margin:24px 0 8px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card.running { border-left:3px solid var(--run); }
  .card.queued  { border-left:3px solid var(--que); }
  .card.completed { border-left:3px solid var(--ok); }
  .card.failed, .card.timed_out { border-left:3px solid var(--err); }
  .card.cancelled { border-left:3px solid var(--warn); }
  .card.needs_attention { border-left:3px solid var(--warn); }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:13px;
         padding:2px 0; }
  .row .k { color:var(--muted); flex:0 0 110px; }
  .row .v { text-align:right; word-break:break-all; }
  .state { font-weight:600; font-size:12px; padding:2px 8px; border-radius:10px; }
  .state.RUNNING { color:var(--run); } .state.QUEUED,.state.ACCEPTED { color:var(--que); }
  .state.COMPLETED { color:var(--ok); } .state.FAILED,.state.TIMED_OUT { color:var(--err); }
  .state.CANCELLED { color:var(--warn); } .state.LOST { color:var(--muted); }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { background:#232a36; color:var(--text); border:1px solid var(--line);
           border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.danger:hover { border-color:var(--err); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .empty, .error { padding:40px; text-align:center; color:var(--muted); }
  .error { color:var(--err); }
  .detail { font-size:12px; color:var(--muted); }
  .meta { font-size:11px; color:var(--muted); margin-top:8px; padding-top:6px;
          border-top:1px solid var(--line); }
  a { color:var(--accent); }
  #toast { position:fixed; bottom:20px; right:20px; max-width:380px; z-index:99; }
  .toast { background:#232a36; border:1px solid var(--line); border-left:3px solid var(--accent);
           border-radius:8px; padding:10px 14px; margin-top:8px; font-size:13px; }
  .toast.ok { border-left-color:var(--ok); } .toast.err { border-left-color:var(--err); }
  nav.filter { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  nav.filter button { font-size:12px; }
  nav.filter button.active { border-color:var(--accent); color:var(--accent); }
  form.submit { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;
                background:#14181f; border:1px solid var(--line); border-radius:10px;
                padding:16px; margin:0 0 16px; max-width:1200px; margin-left:auto; margin-right:auto; }
  form.submit label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  form.submit input, form.submit select, form.submit textarea {
    background:#0f1115; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; }
  form.submit textarea { min-height:64px; resize:vertical; }
  form.submit .full { grid-column:1 / -1; }
  form.submit .row2 { grid-column:1 / -1; display:flex; align-items:center; gap:12px; }
  form.submit button[type=submit] { padding:8px 18px; font-size:13px; }
  #stale { display:none; }
  #stale.show { display:block; background:rgba(230,162,60,.12); border:1px solid var(--warn);
    border-radius:8px; padding:8px 14px; margin-bottom:12px; color:var(--warn); font-size:13px; }
  /* ---- Delivery Workspace detail surface (WS-E) ---- */
  #detailPanel { position:fixed; top:0; right:0; bottom:0; width:min(520px,94vw);
    background:#151519; border-left:1px solid #2a2a30; overflow-y:auto;
    transform:translateX(105%); transition:transform .2s ease; z-index:40; padding:20px; }
  #detailPanel.open { transform:translateX(0); }
  #detailPanel h3 { margin:0 0 12px; }
  #detailPanel h4 { margin:14px 0 6px; font-size:13px; text-transform:uppercase;
    letter-spacing:.05em; color:#9aa; }
  #detailPanel .detail-block { border-top:1px solid #26262c; padding:10px 0; }
  #detailPanel ul { margin:4px 0; padding-left:16px; font-size:13px; }
  #detailPanel code { background:#202026; padding:1px 5px; border-radius:4px; font-size:12px; }
  #detailPanel .attention { background:rgba(220,80,60,.12); border:1px solid #d8503c;
    border-radius:8px; padding:8px 12px; margin:8px 0; color:#ff9a85; }
  #detailPanel .detail-actions { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  #detailPanel .detail-actions button, #detailPanel button { background:#2a2a32;
    color:#e8e8ee; border:1px solid #3a3a44; border-radius:6px; padding:6px 10px;
    font-size:12px; cursor:pointer; }
  #detailPanel .detail-actions button:hover, #detailPanel button:hover { background:#34343e; }
  #detailPanel .evidence-view { background:#101014; border:1px solid #26262c;
    border-radius:6px; padding:10px; font-size:12px; white-space:pre-wrap;
    max-height:300px; overflow:auto; }
  body.stale #detailPanel { opacity:.7; }
</style>
</head>
<body>
<header>
  <h1>Conduvera · Activity</h1>
  <span id="conn">verbinde…</span>
  <span id="counts"></span>
</header>
<nav class="filter" id="filter" style="padding:12px 20px 0;max-width:1200px;margin:0 auto">
  <button data-f="all" class="active">Alle</button>
  <button data-f="queued">Queue</button>
  <button data-f="running">Running</button>
  <button data-f="attention">Aufmerksamkeit</button>
  <button data-f="failed">Fehlgeschlagen</button>
  <button data-f="completed">Abgeschlossen</button>
  <button data-f="cancelled">Abgebrochen</button>
  <button data-f="timed_out">Timeout</button>
</nav>
<main>
  <form class="submit" id="submitForm">
    <label>Repository
      <select id="f_repo">
        <option value="conduvera-core">conduvera-core</option>
        <option value="conduit-fixture">conduit-fixture</option>
      </select>
    </label>
    <label>Harness
      <select id="f_harness">
        <option value="codex_cli">codex_cli</option>
        <option value="opencode_cli">opencode_cli</option>
        <option value="hermes_scoped">hermes_scoped</option>
        <option value="acceptance_fixture_cli">acceptance_fixture_cli</option>
      </select>
    </label>
    <label>Base-Commit
      <input id="f_base" placeholder="(leer = HEAD)">
    </label>
    <label>Task-Klasse
      <select id="f_tasktype"><option value="code_change">code_change</option></select>
    </label>
    <label>Timeout (s)
      <input id="f_timeout" type="number" value="120">
    </label>
    <label>Hold (s) — acceptance_fixture_cli
      <input id="f_hold" type="number" value="60">
    </label>
    <label>Scenario (acceptance_fixture_cli)
      <select id="f_scenario">
        <option value="">—</option>
        <option>HOLD_UNTIL_CANCEL</option>
        <option>HOLD_THEN_EXIT_0</option>
        <option>EXIT_7</option>
        <option>HOLD_UNTIL_TIMEOUT</option>
        <option>EXIT_0_WITH_INVALID_EVIDENCE</option>
      </select>
    </label>
    <label class="full">Anweisungen
      <textarea id="f_prompt" placeholder="Task-Beschreibung"></textarea>
    </label>
    <div class="row2">
      <button type="submit">Job einreichen</button>
      <span class="detail" id="submitResult"></span>
    </div>
  </form>
  <div id="stale"></div>
  <div id="sections"></div>
  <aside id="detailPanel" aria-label="Delivery Detail"></aside>
</main>
<div id="toast"></div>
<script>
"use strict";
const API = "/api";
let filter = "all";
let lastData = null;

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.from((r||document).querySelectorAll(s)); }

function stateOf(item){
  // item is a job (terminal) or a queued attempt or a running session
  const s = (item.state||"").toUpperCase();
  if (["COMPLETED","FAILED","CANCELLED","TIMED_OUT"].includes(s)) return s;
  if (s === "RUNNING" || s === "STARTING") return "RUNNING";
  if (["QUEUED","ACCEPTED","CLAIMED"].includes(s)) return "QUEUED";
  return s || "UNKNOWN";
}
function sectionClass(st){
  const map = {RUNNING:"running",QUEUED:"queued",COMPLETED:"completed",
               FAILED:"failed",TIMED_OUT:"timed_out",CANCELLED:"cancelled",
               LOST:"needs_attention"};
  return map[st] || "needs_attention";
}
function groupOf(st){
  if (["RUNNING","STARTING"].includes(st)) return "Running";
  if (["QUEUED","ACCEPTED","CLAIMED"].includes(st)) return "Queued";
  if (st === "COMPLETED") return "Completed";
  if (st === "FAILED") return "Failed";
  if (st === "CANCELLED") return "Cancelled";
  if (st === "TIMED_OUT") return "Timed out";
  return "Needs attention"; // LOST / UNKNOWN / other
}

function jobKey(d){
  return (d.job_id||"") + "|" + (d.attempt_id||"") + "|" + (d.session_id||"");
}

function runAction(method, params){
  return fetch(API+"/action", {method:"POST", headers:{"Content-Type":"application/json"},
             body: JSON.stringify({method, params})}).then(r=>r.json());
}

// ---- WS-B: graphical submit workflow (same Control-Plane authority) ----
const retryKeys = {};
function doSubmit(ev){
  ev.preventDefault();
  const params = {
    task_id: "ui_" + Date.now().toString(36),
    attempt_id: "a" + Math.random().toString(36).slice(2, 8),
    harness: $("#f_harness").value,
    repo: $("#f_repo").value,
    base_commit: $("#f_base").value || undefined,
    task_type: $("#f_tasktype").value,
    timeout_s: parseFloat($("#f_timeout").value) || 120,
    prompt: $("#f_prompt").value,
    model_binding: {},
    scenario: $("#f_scenario").value || undefined,
    hold_s: parseFloat($("#f_hold").value) || 60,
    fixture_out: "fixture-status.json",
  };
  const btn = $("button[type=submit]", ev.target);
  btn.disabled = true;
  $("#submitResult").textContent = "…sende";
  runAction("submit", params).then(r=>{
    btn.disabled = false;
    if (r && r.ok){
      const res = r.result||{};
      $("#submitResult").textContent =
        "job " + res.job_id + " · attempt " + res.attempt_id +
        " · payload " + (res.payload_ref||"").slice(0,12) +
        " · hash " + String(res.content_sha256||"").slice(0,12);
      $("#f_prompt").value = "";
    } else {
      $("#submitResult").textContent =
        "abgelehnt: " + ((r && (r.error && r.error.message)) || (r && r.result && r.result.message) || "?");
    }
  }).catch(e=>{
    btn.disabled = false;
    $("#submitResult").textContent = "Fehler: " + e.message;
  }).then(()=>refresh());
}
$("#submitForm").addEventListener("submit", doSubmit);

// ---- WS-C/E: idempotent retry (same job, new attempt, stable key) ----
function doRetry(job_id, btn){
  btn.disabled = true;
  if (!retryKeys[job_id]) retryKeys[job_id] = crypto.randomUUID();
  const key = retryKeys[job_id];
  return runAction("retry", {job_id, idempotency_key: key}).then(r=>{
    if (r && r.ok){
      const res = r.result||{};
      toast("Retry: " + res.attempt_id + " (" + (res.duplicate?"idempotent":"neu") + ")", "ok");
    } else {
      toast(((r && r.error && r.error.message) || (r && r.result && r.result.message) || "abgelehnt"), "err");
    }
  }).finally(()=>{ refresh(); });
}
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast "+(kind||"");
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(()=>el.remove(), 5000);
}

function cardActions(item){
  const id = item.session_id || item.job_id;
  const el = document.createElement("div");
  el.className = "actions";
  const mk = (label, method, params, cls)=>{
    const b = document.createElement("button");
    b.textContent = label; b.className = cls||"";
    b.addEventListener("click", async ()=>{
      b.disabled = true;
      try {
        const r = await runAction(method, params||{});
        if (r && r.ok) toast((r.result && (r.result.message||r.result.state)) || "ok", "ok");
        else toast((r && r.error && r.error.message) || "abgelehnt", "err");
      } catch(e){ toast("Fehler: "+e.message, "err"); }
      refresh();
    });
    return b;
  };
  // DOD-08: EXTERNAL sessions are read-only — only Inspect, never control.
  const isExternal = String(item.ownership_class||"").startsWith("EXTERNAL");
  if (item.session_id || item.job_id){
    // Inspect opens the real Delivery detail surface (WS-E), not just a toast
    const b = document.createElement("button");
    b.textContent = "Inspect";
    b.addEventListener("click", ()=>{
      openDetail(item.job_id || id, item.attempt_id || "", item.delivery_id || null);
    });
    el.appendChild(b);
  }
  if (item.session_id && !isExternal){
    el.appendChild(mk("Cancel", "cancel", {session_id: id}, "danger"));
  }
  if (item.session_id && !isExternal){
    el.appendChild(mk("Cleanup", "cleanup", {session_id: id}));
  }
  if (item.job_id && !isExternal && ["COMPLETED","FAILED","CANCELLED","TIMED_OUT"].includes(stateOf(item))){
    const b = document.createElement("button");
    b.textContent = "Retry";
    b.addEventListener("click", ()=>doRetry(id, b));
    el.appendChild(b);
  }
  return el;
}

function renderItem(item, section, source){
  const st = stateOf(item);
  const card = document.createElement("div");
  card.className = "card " + sectionClass(st);
  card.dataset.state = st;

  const head = document.createElement("div");
  head.className = "row";
  const t = document.createElement("span");
  t.textContent = item.task_id || item.job_id || "?";
  const s = document.createElement("span");
  s.className = "state"; s.textContent = st;
  head.appendChild(t); head.appendChild(s);
  card.appendChild(head);

  const add = (k,v)=>{ const r=document.createElement("div"); r.className="row";
    const kk=document.createElement("span"); kk.className="k"; kk.textContent=k;
    const vv=document.createElement("span"); vv.className="v"; vv.textContent=v||"—";
    r.appendChild(kk); r.appendChild(vv); card.appendChild(r); };
  add("Harness", item.harness);
  add("Job", item.job_id);
  add("Attempt", item.attempt_id);
  if (item.session_id) add("Session", item.session_id);
  add("Base", (item.base_commit||"").slice(0,10));
  add("Payload", (item.payload_ref||"").slice(0,14));
  if (item.hash || item.content_sha256) add("Hash", String(item.hash||item.content_sha256).slice(0,16));
  if (item.elapsed_s != null) add("Elapsed", item.elapsed_s+"s");
  if (item.deadline_utc) add("Deadline", item.deadline_utc.slice(11,19)+" UTC");
  if (item.exit_code != null) add("Exit", item.exit_code);
  if (item.terminal_reason) add("Reason", item.terminal_reason);
  if (item.result_refs && item.result_refs.length){
    const d=document.createElement("div"); d.className="row";
    const kk=document.createElement("span"); kk.className="k"; kk.textContent="Evidence";
    const links=document.createElement("span"); links.className="v";
    item.result_refs.forEach(ref=>{
      const a=document.createElement("a"); a.href="#"; a.textContent=ref.split("/").pop().slice(0,24);
      a.addEventListener("click",(ev)=>{ ev.preventDefault(); toast("Evidence: "+ref); });
      links.appendChild(a); links.appendChild(document.createTextNode(" "));
    });
    d.appendChild(kk); d.appendChild(links); card.appendChild(d);
  }
  if (item.worktree) add("Worktree", item.worktree.split("/").slice(-2).join("/"));

  card.appendChild(cardActions(item));
  return card;
}

function render(data){
  lastData = data;
  const out = $("#sections");
  out.innerHTML = "";
  const cards = []; // {group, el}
  // queued
  (data.queued||[]).forEach(q=>{ if(filter!=="all" && filter!=="queued") return;
    cards.push({group:"Queued", el:renderItem(q,"queued","queued")}); });
  // running
  (data.running||[]).forEach(r=>{ if(filter!=="all" && filter!=="running") return;
    cards.push({group:"Running", el:renderItem(r,"running","running")}); });
  // terminal -> group
  (data.terminal||[]).forEach(t=>{
    if(filter!=="all" && filter!==groupOf(t.state).toLowerCase().replace(/ /g,"_")
       && filter!==stateOf(t).toLowerCase()) return;
    cards.push({group:groupOf(t.state), el:renderItem(t,"terminal","terminal")});
  });
  // grouped output
  const order = ["Running","Queued","Needs attention","Failed","Timed out","Cancelled","Completed"];
  order.forEach(g=>{
    const items = cards.filter(c=>c.group===g);
    if(!items.length) return;
    const title = document.createElement("div"); title.className="section-title"; title.textContent=g;
    out.appendChild(title);
    const wrap = document.createElement("div"); wrap.className="cards";
    items.forEach(i=>wrap.appendChild(i.el));
    out.appendChild(wrap);
  });
  if(!cards.length){
    const e = document.createElement("div"); e.className="empty";
    e.textContent = "Keine Jobs im aktuellen Filter.";
    out.appendChild(e);
  }
}

function refresh(){
  fetch(API+"/console").then(r=>{
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(body=>{
    if(!body.ok) throw new Error(body.error && body.error.message || "api error");
    $("body").classList.remove("stale");
    $("#stale").className = "";
    $("#stale").textContent = "";
    $("#conn").textContent = "live"; $("#conn").className="live";
    const c = body.result.counts||{};
    $("#counts").textContent = "queue "+c.queued+" · running "+c.running+" · terminal "+c.terminal;
    lastData = body.result;
    render(body.result);
  }).catch(e=>{
    $("#conn").textContent = "getrennt"; $("#conn").className="stale";
    // retain last good snapshot as visibly stale, never empty-as-none
    if (lastData){
      $("body").classList.add("stale");
      $("#stale").className = "show";
      $("#stale").textContent = "Verbindung getrennt — zeige letzten Stand (veraltet). Automatische Wiederverbindung läuft…";
    } else {
      const out = $("#sections");
      out.innerHTML = "";
      const e = document.createElement("div"); e.className="error";
      e.textContent = "Keine Verbindung zur Control-Plane.";
      out.appendChild(e);
    }
  });
}

// filter nav
$$("#filter button").forEach(b=>{
  b.addEventListener("click", ()=>{
    filter = b.dataset.f;
    $$("#filter button").forEach(x=>x.classList.toggle("active", x===b));
    if(lastData) render(lastData);
  });
});

// ---- Delivery Workspace (SHIP-CONDUVERA-DELIVERY) ----------------------
let deliveryList = [];
let selectedDeliveryId = null;
let selectedDiff = null;

function loadDeliveries(){
  return runAction("delivery_list", {}).then(r=>{
    if(r && r.ok){ deliveryList = (r.result&&r.result.deliveries)||[]; return deliveryList; }
    return [];
  }).catch(()=>[]);
}

function deliveryAttention(d){
  return (d && d.attention_reasons)||[];
}

function openDetail(jobId, attemptId, deliveryId){
  selectedDeliveryId = deliveryId || null;
  // DOD-13 review3: bind to the EXACT delivery/attempt opened — never the
  // first delivery with the same job id (jobs may have several deliveries)
  let rec = null;
  if(deliveryId){ rec = deliveryList.find(x=>x.delivery_id===deliveryId) || null; }
  if(!rec){ rec = deliveryList.find(x=>x.job_id===jobId && (x.attempt_id===attemptId || !attemptId)) || deliveryList.find(x=>x.job_id===jobId) || null; }
  const panel = $("#detailPanel");
  panel.classList.add("open");
  panel.innerHTML = "";
  const h = document.createElement("h3"); h.textContent = "Detail · "+(jobId||attemptId||"");
  panel.appendChild(h);
  const close = document.createElement("button"); close.textContent="Schließen";
  close.addEventListener("click", ()=>panel.classList.remove("open"));
  panel.appendChild(close);
  // Job & execution block
  const jobBox = document.createElement("div"); jobBox.className="detail-block";
  jobBox.innerHTML = "<h4>Job / Ausführung</h4>";
  const list = document.createElement("ul");
  list.innerHTML = "<li>Job: <code>"+esc(jobId||"")+"</code></li>"+
    "<li>Attempt: <code>"+esc(attemptId||"")+"</code></li>"+
    (rec?("<li>Delivery: <code>"+esc(rec.delivery_id||"")+"</code></li>"+
          "<li>State: <b>"+esc(rec.delivery_state||"")+"</b></li>"):"");
  jobBox.appendChild(list);
  panel.appendChild(jobBox);
  // Delivery block (from record)
  if(rec){
    const dv = document.createElement("div"); dv.className="detail-block";
    dv.innerHTML = "<h4>Delivery</h4><ul>"+
      "<li>Branch: <code>"+esc(rec.branch_name||"—")+"</code></li>"+
      "<li>Head: <code>"+esc(rec.branch_head_sha||"—")+"</code></li>"+
      (rec.pull_request_url?("<li>PR: <a href=\""+esc(rec.pull_request_url)+"\" target=\"_blank\" rel=\"noopener\">#"+esc(String(rec.pull_request_number||""))+"</a></li>"):"")+
      "<li>Base SHA: <code>"+esc(rec.pull_request_base_sha||rec.base_commit||"—")+"</code></li>"+
      "<li>Mergeability: "+esc(rec.mergeability||"—")+"</li>"+
      "<li>Last sync: "+esc(rec.last_synced_at||"—")+"</li>"+
      "</ul>";
    panel.appendChild(dv);
    const att = deliveryAttention(rec);
    if(att.length){
      const a = document.createElement("div"); a.className="attention";
      a.innerHTML="<h4>Attention</h4><ul>"+att.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
      panel.appendChild(a);
    }
  }
  // WS actions: available even before a delivery record exists (fresh job),
  // so an operator can select the attempt and build the first candidate
  const acts = document.createElement("div"); acts.className="detail-actions";
  const sel = mkBtn("Select Attempt", ()=>{
    const aid = prompt("Attempt ID (delivery source):", attemptId||"");
    if(aid) runAction("delivery_select_attempt",{job_id:jobId, attempt_id:aid}).then(r=>{refresh();toast("selected: "+(r.result&&r.result.selected_attempt_id||"?"));});
  });
  const pre = mkBtn("Preflight", ()=>runAction("delivery_preflight",{job_or_delivery:jobId, attempt_id:attemptId||null}).then(r=>{refresh();toast(JSON.stringify((r.result||{}).reasons||[]).slice(0,200));}));
  const app = mkBtn("Approve Candidate", ()=>{
    const cid = prompt("Candidate ID:", (rec&&rec.candidate_id||""));
    if(cid) runAction("delivery_candidate_approve",{candidate_id:cid, approved_by:"operator"}).then(r=>{refresh();toast("approved: "+(r.result&&r.result.candidate_id||"?"));});
  });
  const pub = mkBtn("Publish PR", ()=>runAction("delivery_publish",{job_or_delivery:jobId, attempt_id:attemptId||null, candidate_id:(rec&&rec.candidate_id)||null}).then(r=>{refresh();toast(r.result&&r.result.ok?"Published: "+(r.result.record.pull_request_url||""):"Publish blockiert");}));
  const sync = mkBtn("Refresh GitHub", ()=>runAction("delivery_sync",{job_or_delivery:jobId}).then(r=>{refresh();toast("sync -> "+(r.result&&r.result.state||""));}));
  const cln = mkBtn("Cleanup", ()=>runAction("delivery_cleanup",{job_or_delivery:jobId,safe_only:true}).then(r=>{refresh();toast("cleanup: "+(r.result&&r.result.message||""));}));
  acts.appendChild(sel); acts.appendChild(pre); acts.appendChild(app); acts.appendChild(pub); acts.appendChild(sync); acts.appendChild(cln);
  panel.appendChild(acts);
  // Evidence block
  const ev = document.createElement("div"); ev.className="detail-block";
  ev.innerHTML = "<h4>Evidence</h4><div id=\"evidenceBox\">lädt…</div>";
  panel.appendChild(ev);
  if(lastData){
    const term = (lastData.terminal||[]).find(x=>x.job_id===jobId) || (lastData.running||[]).find(x=>x.job_id===jobId);
    if(term && term.result_refs && term.result_refs.length){
      const box = panel.querySelector("#evidenceBox");
      box.innerHTML = "<ul>"+term.result_refs.map(x=>"<li><code>"+esc(x)+"</code></li>").join("")+"</ul>";
      box.appendChild(mkBtn("EvidenceBundle anzeigen", ()=>viewEvidence(term.result_refs)));
    }
  }
  // Changes block
  const ch = document.createElement("div"); ch.className="detail-block";
  ch.innerHTML = "<h4>Änderungen (Diff)</h4><div id=\"diffBox\">—</div>";
  panel.appendChild(ch);
  // WS H dogfood: Check + Review Details surface
  const cd = document.createElement("div"); cd.className="detail-block";
  cd.innerHTML = "<h4>Check + Review Details</h4><div id=\"checkDetailBox\">lädt…</div>";
  panel.appendChild(cd);
  if(jobId){
    runAction("delivery_check_details",{job_or_delivery:jobId}).then(r=>{
      const box = panel.querySelector("#checkDetailBox");
      if(!box) return;
      const res = r&&r.result||{};
      let html = "";
      html += "<b>Mergeability:</b> "+esc(res.mergeable||"—")+" · <b>Merge state:</b> "+esc(res.merge_state||"—")+"<br/>";
      html += "<b>Attention:</b> "+esc((res.attention||[]).join(", ")||"—")+"<br/><br/>";
      html += "<b>Checks:</b><ul>";
      (res.checks||[]).forEach(c=>{
        html += "<li>"+esc(c.name)+": <b>"+esc(c.conclusion||c.status||"?")+"</b>"+
          (c.started_at?(" · "+esc(String(c.started_at).slice(0,19)).replace("T"," ")):"")+
          (c.details_url?(" · <a href=\""+esc(c.details_url)+"\" target=\"_blank\" rel=\"noopener\">details</a>"):"")+
          (c.required?" · required":" · optional")+"</li>";
      });
      html += "</ul>";
      html += "<b>Reviews:</b><ul>";
      (res.reviews||[]).forEach(rv=>{
        html += "<li>"+esc(rv.state)+" by "+esc(rv.author||"—")+"</li>";
      });
      html += "</ul>";
      html += "<b>Delivery timeline:</b><ol>";
      (res.timeline||[]).forEach(ev=>{
        html += "<li>"+esc(ev.event||ev.state||"?")+" @ "+esc(ev.at||ev.time||"—")+"</li>";
      });
      html += "</ol>";
      box.innerHTML = html || "keine Details";
    }).catch(()=>{ const box=panel.querySelector("#checkDetailBox"); if(box) box.textContent="Details nicht verfügbar"; });
  }
}

function viewEvidence(refs){
  const panel = $("#detailPanel");
  const box = panel.querySelector("#evidenceBox");
  if(box){
    box.innerHTML = "<h4>EvidenceBundles</h4>";
    const dl = document.createElement("pre"); dl.className="evidence-view";
    box.appendChild(dl);
    Promise.all((refs||[]).map(ref=>runAction("inspect", {session_id: ref}).then(()=>({ref})).catch(()=>({ref})))).then(items=>{
      dl.textContent = items.map(i=>i.ref).join("\n") + "\n(schema CONDUVERA-EVIDENCE; hashes in console)";
    });
  }
}

function mkBtn(label, handler){
  const b = document.createElement("button");
  b.textContent = label;
  b.addEventListener("click", handler);
  return b;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---- SSE event stream (WS-F) -------------------------------------------
let es = null;
let lastEventId = 0;
function startEvents(){
  if(es){ try{ es.close(); }catch(e){} }
  es = new EventSource(API+"/events?last_event_id="+lastEventId);
  es.onopen = ()=>{ $("body").classList.remove("stale"); $("body").classList.add("streaming"); };
  es.onmessage = (ev)=>{
    lastEventId = parseInt(ev.lastEventId||"0",10)||lastEventId;
    refresh();
  };
  es.onerror = ()=>{
    $("body").classList.add("stale");
    $("#stale").className="show";
    $("#stale").textContent = "Event-Stream nicht verfügbar — Aktualisierung über Polling (veraltet).";
  };
}

// wire filter input for repo/harness/state/attention
const filterInput = document.createElement("input");
filterInput.id="deliveryFilter"; filterInput.placeholder="filter: repo / harness / state / PR / id / attention";
filterInput.style.cssText="width:100%;padding:8px;margin:8px 0;box-sizing:border-box;background:#1b1b1f;color:#eee;border:1px solid #333;border-radius:6px;";
$("#filter").appendChild(filterInput);

refresh();
startEvents();
setInterval(()=>{ if(!es || es.readyState!==EventSource.OPEN) refresh(); }, 2000);
</script>
</body>
</html>
